<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayDigital - Download</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶️</text></svg>">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0c10; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; flex-direction: column; }
        .container { background: #1f2833; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 255, 204, 0.1); text-align: center; max-width: 400px; width: 90%; border: 1px solid #45a29e; }
        h2 { color: #66fcf1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        p { color: #c5c6c7; font-size: 14px; margin-bottom: 20px; }
        input { width: 90%; padding: 14px; margin: 10px 0; border: 2px solid #45a29e; border-radius: 8px; font-size: 18px; background: #0b0c10; color: #66fcf1; outline: none; text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        input:focus { border-color: #66fcf1; box-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        .btn-verificar { background: #45a29e; color: #0b0c10; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; text-transform: uppercase; }
        .btn-verificar:hover { background: #66fcf1; }
        .message { margin-top: 15px; font-weight: bold; color: #ff4c4c; }
        .success { color: #66fcf1; margin-bottom: 15px; }
        
        #downloadSection { display: none; margin-top: 20px; border-top: 1px solid #45a29e; padding-top: 20px; }
        
        .btn-download { background: #66fcf1; color: #0b0c10; border: none; padding: 16px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; transition: 0.3s; text-transform: uppercase; }
        .btn-download:hover { background: #fff; box-shadow: 0 0 15px rgba(102, 252, 241, 0.8); }
        .btn-download.secundario { background: #45a29e; color: #fff;}
        .btn-download.secundario:hover { background: #66fcf1; color: #0b0c10; }
        
        .whatsapp-box { margin-top: 25px; padding-top: 15px; border-top: 1px solid #45a29e; font-size: 13px; color: #c5c6c7; }
        .whatsapp-number { display: block; color: #66fcf1; font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            <svg width="35" height="35" viewBox="0 0 24 24" fill="#66fcf1" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
            </svg>
            PlayDigital
        </h2>
        <p>Digite seu código exclusivo para liberar a rede.</p>
        <input type="text" id="keyInput" placeholder="SUA CHAVE AQUI">
        <button class="btn-verificar" onclick="verificarChave()">Validar Acesso</button>
        <p class="message" id="msg"></p>

        <div id="downloadSection">
            <p class="success" id="successMsg">Conexão segura estabelecida!</p>
            
            <button class="btn-download" onclick="baixarEQueimar('VELOPLAY')">
                ⬇️ 1. Baixar Veloplay (App)
            </button>
            
            <button class="btn-download secundario" onclick="baixarEQueimar('BASE')">
                ⬇️ 2. Baixar App Secundário
            </button>
            
            <p style="font-size: 11px; color: #c5c6c7; margin-top: 15px;">Sistema Anti-Bloqueio Ativado. Não feche esta tela até concluir as duas instalações.</p>
        </div>

        <div class="whatsapp-box">
            Precisa de suporte ou nova chave? WhatsApp:
            <span class="whatsapp-number">(61) 98165-5652</span>
        </div>
    </div>

    <script>
        // A SUA URL MASTER (NOVA) JÁ ESTÁ AQUI:
        const URL_SERVIDOR = "https://script.google.com/macros/s/AKfycbyd5YHL5kbbnldswLaFu5rr97eACsZduAJJMepOBC7MU53j-c8d6eVZeUFKNdqA8aeK/exec"; 
        
        let chaveAtual = "";
        let linksLiberados = false;
        let linkVeloplayMemoria = "";
        let linkBaseMemoria = "";

        async function verificarChave() {
            const key = document.getElementById("keyInput").value.trim().toUpperCase();
            const msg = document.getElementById("msg");
            const downloadSection = document.getElementById("downloadSection");

            if(!key) {
                msg.textContent = "Código vazio.";
                msg.className = "message";
                return;
            }

            msg.textContent = "Autenticando na rede...";
            msg.style.color = "#c5c6c7";
            downloadSection.style.display = "none";

            try {
                const response = await fetch(URL_SERVIDOR + "?acao=verificar&chave=" + encodeURIComponent(key), { redirect: 'follow' });
                const data = await response.json();

                if(data.status === "sucesso") {
                    msg.textContent = "";
                    chaveAtual = key; 
                    downloadSection.style.display = "block";
                } else {
                    msg.textContent = data.mensagem;
                    msg.style.color = "#ff4c4c";
                }
            } catch(e) {
                msg.textContent = "Acesso negado ou erro de rede.";
                msg.style.color = "#ff4c4c";
            }
        }

        async function baixarEQueimar(qualApp) {
            const msg = document.getElementById("msg");

            if (linksLiberados) {
                abrirLink(qualApp);
                return;
            }

            msg.textContent = "Descriptografando links...";
            msg.style.color = "#66fcf1";

            try {
                const response = await fetch(URL_SERVIDOR + "?acao=queimar&chave=" + encodeURIComponent(chaveAtual), { redirect: 'follow' });
                const data = await response.json();
                
                if(data.status === "sucesso") {
                    linksLiberados = true;
                    linkVeloplayMemoria = data.link_veloplay;
                    linkBaseMemoria = data.link_base;
                    
                    msg.textContent = "Conexão liberada! Sua chave foi desativada no servidor.";
                    abrirLink(qualApp);
                } else {
                    msg.textContent = data.mensagem;
                    msg.style.color = "#ff4c4c";
                }
            } catch(e) {
                msg.textContent = "Falha de comunicação segura.";
                msg.style.color = "#ff4c4c";
            }
        }

        function abrirLink(qualApp) {
            if (qualApp === 'VELOPLAY') {
                window.location.href = linkVeloplayMemoria;
            } else if (qualApp === 'BASE') {
                window.location.href = linkBaseMemoria;
            }
        }
    </script>
</body>
</html>
