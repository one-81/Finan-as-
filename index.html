<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Exclusivo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; flex-direction: column; }
        .container { background: #2a2a40; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; border: 1px solid #444; }
        h2 { color: #00d2ff; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #555; border-radius: 5px; font-size: 16px; background: #1e1e2f; color: #fff; outline: none; text-align: center; text-transform: uppercase; }
        input:focus { border-color: #00d2ff; }
        .btn-verificar { background: #00d2ff; color: #111; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-verificar:hover { background: #00a8cc; }
        .message { margin-top: 15px; font-weight: bold; color: #ff4c4c; }
        .success { color: #4cff61; margin-bottom: 15px; }
        
        #downloadSection { display: none; margin-top: 20px; border-top: 1px solid #555; padding-top: 20px; }
        
        .btn-download { background: #4cff61; color: #111; border: none; padding: 14px 20px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        .btn-download:hover { background: #3ade4e; }
        .btn-download.secundario { background: #ffaa00; }
        .btn-download.secundario:hover { background: #e69900; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Área de Download</h2>
        <p>Digite a chave de acesso que você recebeu no WhatsApp.</p>
        <input type="text" id="keyInput" placeholder="Ex: TESTE123">
        <button class="btn-verificar" onclick="verificarChave()">Verificar Acesso</button>
        <p class="message" id="msg"></p>

        <div id="downloadSection">
            <p class="success" id="successMsg">Chave validada! Escolha o aplicativo:</p>
            
            <button class="btn-download" onclick="baixarEQueimar('VELOPLAY')">
                ⬇️ 1. Baixar Veloplay
            </button>
            
            <button class="btn-download secundario" onclick="baixarEQueimar('BASE')">
                ⬇️ 2. Baixar Base App
            </button>
            
            <p style="font-size: 12px; color: #aaa; margin-top: 15px;">Atenção: A chave será consumida assim que você iniciar o primeiro download. Baixe os dois sem fechar essa tela!</p>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES:
        // Coloque a URL do seu Google Sheets aqui depois:
        const URL_SERVIDOR = "http://localhost:5000"; 
        
        // COLE OS LINKS DO MEDIAFIRE AQUI DENTRO DAS ASPAS:
        const LINK_VELOPLAY = "https://www.mediafire.com/file/bghgxiigmc7k88s/file";
        const LINK_BASE = "https://www.mediafire.com/file/10r3pom2iowpgo9/file";

        let chaveAtual = "";

        async function verificarChave() {
            const key = document.getElementById("keyInput").value.trim().toUpperCase();
            const msg = document.getElementById("msg");
            const downloadSection = document.getElementById("downloadSection");

            if(!key) {
                msg.textContent = "Por favor, digite uma chave.";
                msg.className = "message";
                return;
            }

            msg.textContent = "Consultando banco de chaves...";
            msg.style.color = "#aaa";
            downloadSection.style.display = "none";

            try {
                // Apenas VERIFICA se a chave é válida, não queima ela
                const response = await fetch(URL_SERVIDOR + "/verificar?chave=" + encodeURIComponent(key));
                const data = await response.json();

                if(data.status === "sucesso") {
                    msg.textContent = "";
                    chaveAtual = key; // Guarda a chave para queimar depois
                    downloadSection.style.display = "block";
                } else {
                    msg.textContent = data.mensagem;
                    msg.style.color = "#ff4c4c";
                }
            } catch(e) {
                msg.textContent = "Erro de conexão com o banco de chaves.";
                msg.style.color = "#ff4c4c";
            }
        }

        async function baixarEQueimar(qualApp) {
            const msg = document.getElementById("msg");
            msg.textContent = "Iniciando download...";
            msg.style.color = "#4cff61";

            // Escolhe qual link abrir
            let linkParaBaixar = "";
            if (qualApp === 'VELOPLAY') {
                linkParaBaixar = LINK_VELOPLAY;
            } else if (qualApp === 'BASE') {
                linkParaBaixar = LINK_BASE;
            }

            try {
                // Queima a chave em segundo plano
                await fetch(URL_SERVIDOR + "/queimar?chave=" + encodeURIComponent(chaveAtual));
                
                // Abre o link do download na TV
                window.location.href = linkParaBaixar;
                
                msg.textContent = "Download iniciado! Sua chave foi desativada no banco de dados.";
            } catch(e) {
                msg.textContent = "Erro ao iniciar download. Tente novamente.";
                msg.style.color = "#ff4c4c";
            }
        }
    </script>
</body>
</html>
